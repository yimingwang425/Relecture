[project]
name = "a-rules"
version = "0.1.0"
description = "AI 课件讲解助手 · 风格遵循度 A 类规则计算模块"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a_rules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "parse-service"
version = "0.1.0"
description = "AI 课件讲解助手 · F2 课件解析服务（PDF 路径）"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "python-pptx>=1.0",   # schema 已按 PPTX 形状定义；解析路径下次交付
    "pydantic>=2.6",
    # 2026-10-07：独立的 /parse 服务删除后不再需要 fastapi / uvicorn / python-multipart
    # （api/ 自己声明它们）。slicer 是同仓库的本地兄弟包，测试要 `pip install -e ../slicer`。
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parse_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
